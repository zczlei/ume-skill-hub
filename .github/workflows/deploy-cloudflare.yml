name: Deploy to Cloudflare Pages

# 完整 catalog 依赖 ume-ai 的 default-skills，因此自动部署以 ume-ai Actions 为准。
# 本仓库仅作公开源码镜像；如需手动发布，用 workflow_dispatch（且需自备 bundled 数据）。
on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Build
        env:
          PUBLIC_BASE: https://ume-skill-hub.pages.dev
        run: node scripts/build-catalog.mjs
      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 pages deploy public --project-name=ume-skill-hub --branch=main --commit-dirty=true
