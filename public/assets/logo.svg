<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="UME Skill Hub">
  <defs>
    <linearGradient id="g" x1="12" y1="8" x2="52" y2="56" gradientUnits="userSpaceOnUse">
      <stop stop-color="#7c5cff"/>
      <stop offset="0.55" stop-color="#5b8cff"/>
      <stop offset="1" stop-color="#00d1b2"/>
    </linearGradient>
    <linearGradient id="shelf" x1="18" y1="20" x2="46" y2="44" gradientUnits="userSpaceOnUse">
      <stop stop-color="#9b87ff"/>
      <stop offset="1" stop-color="#2dd4bf"/>
    </linearGradient>
  </defs>
  <!-- app tile -->
  <rect width="64" height="64" rx="16" fill="#0b0f14"/>
  <rect x="2.5" y="2.5" width="59" height="59" rx="14" fill="none" stroke="url(#g)" stroke-opacity="0.45" stroke-width="1.5"/>
  <!-- skill shelf: three stacked slots -->
  <rect x="16" y="16" width="32" height="9" rx="3" fill="url(#shelf)" opacity="0.95"/>
  <rect x="16" y="28" width="32" height="9" rx="3" fill="url(#shelf)" opacity="0.72"/>
  <rect x="16" y="40" width="22" height="9" rx="3" fill="url(#shelf)" opacity="0.5"/>
  <!-- accent gem -->
  <circle cx="44" cy="44.5" r="5.2" fill="#00d1b2"/>
</svg>
